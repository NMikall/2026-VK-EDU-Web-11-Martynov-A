{% extends 'layout/base.html' %}
{% load static %}

{% block content %}
<div class="col-md-9">
    <h1>Settings: UserName</h1>
    <form action="#" method="GET">
        <div class="alert alert-danger" role="alert">
            Failed to save changes. Please check the fields below
        </div>
        <div class="input-group mb-1">
            <label class="input-group-text" for="login">Login:</label>
            <input type="text" class="form-control" placeholder="Your login" maxlength="20" id="login" value="Vaska">
        </div>
        <div class="form-text mb-3">Login is a maximum of 20 characters</div>
        <div class="input-group mb-3">
            <label class="input-group-text" for="email">Email:</label>
            <input type="email" class="form-control is-invalid" aria-describedby="email-error" aria-invalid="true"
                   placeholder="Your email" maxlength="100" id="email" value="example@mail.ru">
            <div class="invalid-feedback" id="email-error">You have entered an invalid email address</div>
        </div>
        <div class="input-group mb-3">
            <label class="input-group-text" for="nick">NickName:</label>
            <input type="text" class="form-control" placeholder="Your NickName" maxlength="20" id="nick"
                   value="Makiato">
        </div>
        <div class="form-text mb-3">NickName is a maximum of 20 characters</div>
        <div class="mb-3">
            <label for="formFile" class="form-label">Upload avatar</label>
            <div>
                <img src="{% static 'questions/static/img/avatar.webp' %}" alt="User's photo"
                     width="100" height="100" class="avatar">
            </div>
            <input class="form-control" type="file" id="formFile" accept="image/*">
        </div>
        <div>
            <input class="btn btn-primary" type="submit" value="Save">
        </div>
    </form>
</div>

{% endblock %}
