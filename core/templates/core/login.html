{% extends 'layout/base.html' %}
{% load static %}

{% block content %}
<div class="col-md-9">
    <h1>Log In</h1>
    <form action="#" method="GET">
        <div class="alert alert-danger" role="alert">
            You have entered an incorrect login or password!
        </div>
        <div class="input-group mb-1">
            <label class="input-group-text" for="login">Login:</label>
            <input type="text" class="form-control is-invalid" aria-invalid="true" aria-describedby="login-error"
                   placeholder="Your login" maxlength="20" id="login" required>
            <div class="invalid-feedback" id="login-error">Enter the login</div>
        </div>
        <div class="form-text mb-3">Login is a maximum of 20 characters</div>
        <div class="input-group mb-1">
            <label class="input-group-text" for="password">Password:</label>
            <input type="password" class="form-control" placeholder="Your password" maxlength="50" id="password"
                   required>
        </div>
        <div class="form-text mb-3">Password is a maximum of 50 characters</div>
        <div class="mb-3">
            <input class="btn btn-primary" type="submit" value="Log in!">
        </div>
        <div>
            <h3>Don't have account? </h3>
            <a href="{% url 'signup' %}"><h5>create new account</h5></a>
        </div>
    </form>
</div>
{% endblock %}
