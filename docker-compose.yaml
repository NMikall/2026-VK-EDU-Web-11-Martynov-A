services:
  web:
    build: .
    env_file: .env.docker
    ports:
      - "8000:8000"
    volumes:
      - .:/application
      - ./media:/application/media
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    env_file: .env.docker
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -h 127.0.0.1

volumes:
  postgres_data: