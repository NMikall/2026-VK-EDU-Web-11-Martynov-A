{% load i18n %}
{% load static %}
<div class="p-2" id="answer-{{ answer.id }}">
    <div class="card mb-3">
        <div class="row g-0">
            <div class="col-md-4 d-flex flex-column align-items-center">
                <img class="avatar" src="{{ answer.user.profile.avatar.url }}" alt="avatar" width="100" height="100">
                <div class="d-flex flex-column align-items-center gap-1">
                    <button type="button" class="btn btn-sm btn-outline-success" aria-label="Нравится"
                            aria-pressed="false" {% if not user.is_authenticated %} disabled title="Log in to like" {% endif %}
                            data-id="{{ answer.id }}" data-kind="answer" data-type="like">▲
                    </button>
                    <span class="fw-bold" data-like-counter="answer-{{ answer.id }}">{{ answer.likes }}</span>
                    <button type="button" class="btn btn-sm btn-outline-danger" aria-label="Не нравится"
                            aria-pressed="false" {% if not user.is_authenticated %} disabled title="Log in to dislike" {% endif %}
                            data-id="{{ answer.id }}" data-kind="answer" data-type="dislike">▼
                    </button>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card-body">
                    <p class="card-text">{{ answer.text }}
                    </p>
                    <form>
                        <input type="checkbox" data-question-id="{{ question.id }}" data-answer-id="{{ answer.id }}"
                               {% if answer.best_answer %} checked {% endif %}
                               {% if user.id != question.user_id %} disabled {% endif %}> Good answer
                    </form>
                    <p class="card-text"><small class="text-body-secondary">The answer was given {% language 'en' %}{{ answer.created_at|timesince }}{% endlanguage %} ago</small>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
