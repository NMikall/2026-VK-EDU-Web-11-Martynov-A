{% load static %}
<div class="p-2">
    <div class="card mb-3">
        <div class="row g-0">
            <div class="col-md-4 d-flex flex-column align-items-center">
                <img src="{% static 'questions/static/img/avatar.webp' %}" alt="avatar" width="100" height="100">
                <div class="d-flex flex-column align-items-center gap-1">
                    <button type="button" class="btn btn-sm btn-outline-success" aria-label="Нравится"
                            aria-pressed="false">▲
                    </button>
                    <span class="fw-bold">5</span>
                    <button type="button" class="btn btn-sm btn-outline-danger" aria-label="Не нравится"
                            aria-pressed="false">▼
                    </button>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card-body">
                    <p class="card-text">{{ question.text }}
                    </p>
                    <form>
                        <input type="checkbox" checked disabled> Good answer
                    </form>
                    <p class="card-text"><small class="text-body-secondary">The answer was given 3 mins ago</small>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
