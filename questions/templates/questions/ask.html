{% extends 'layout/base.html' %}
{% load static %}

{% block content %}
<div class="col-md-9">
    <h1>New Question</h1>
    <form action="#" method="GET">
        <div class="alert alert-danger" role="alert">
            The request could not be sent.
        </div>
        <div class="input-group mb-1">
            <label class="input-group-text" for="title">Title:</label>
            <input type="text" id="title" class="form-control" maxlength="100" placeholder="Your title" required>
        </div>
        <div class="form-text mb-3">Title is a maximum of 100 characters</div>
        <div class="input-group mb-1">
            <label class="input-group-text" for="text">Text:</label>
            <textarea class="form-control" placeholder="Your text" maxlength="2000" id="text" required></textarea>
        </div>
        <div class="form-text mb-3">Text is a maximum of 2000 characters</div>
        <div class="input-group mb-1">
            <label class="input-group-text" for="tags">Tags:</label>
            <input type="text" class="form-control is-invalid" maxlength="100" aria-describedby="tags-error"
                   aria-invalid="true" placeholder="Tags. Example: moon, park, cool" id="tags" required>
            <div class="invalid-feedback" id="tags-error">no more than 3 tags</div>
        </div>
        <div class="form-text mb-3">Tags are a maximum of 100 characters</div>
        <div>
            <input class="btn btn-primary" type="submit" value="Ask!">
        </div>
    </form>
</div>
{% endblock %}
